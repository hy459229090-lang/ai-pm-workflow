<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title"><title id="title">何阳 RicHe｜产品经理，腾讯到网易。给用户做产品，给自己造工具。社区、增长、商业化经验；目前做 C 端 Agent 和个人产研工作系统。</title><style>text{font-family:'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif} .en{font-family:Arial,sans-serif} .mono{font-family:'Liberation Mono',Consolas,monospace;letter-spacing:1.4px}.signal{animation:pulse 4s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.signal{animation:none}}</style><rect x="0" y="0" width="1200" height="610" rx="18" fill="#131719"/><rect x="835" y="0" width="365" height="610" rx="18" fill="#192023"/><path d="M835 0V610" fill="none" stroke="#343D40" stroke-width="1" /><path d="M874 78H1160M874 527H1160" fill="none" stroke="#343D40" stroke-width="1" /><text x="40" y="48" font-size="20" fill="#EFF1E8" font-weight="500">何阳 / HE YANG</text><text x="1160" y="48" font-size="14" fill="#B2BDB8" class="mono" text-anchor="end">PRODUCT · SYSTEMS · PLAY</text><text x="34" y="214" font-size="163" fill="#EFF1E8" font-weight="800" class="en" letter-spacing="-10">RicHe</text><text x="42" y="307" font-size="51" fill="#EFF1E8" font-weight="700">给用户做产品。</text><text x="42" y="377" font-size="51" fill="#D4F477" font-weight="700">给自己造工具。</text><text x="44" y="441" font-size="24" fill="#B2BDB8">社区、增长、商业化，是我的业务底子。</text><text x="44" y="480" font-size="23" fill="#B2BDB8">现在做 C 端 Agent，也搭自己的产研工作系统。</text><path d="M42 524H792" fill="none" stroke="#343D40" stroke-width="1" /><text x="43" y="568" font-size="21" fill="#EFF1E8" font-weight="600">产品经理</text><text x="155" y="568" font-size="21" fill="#B2BDB8">腾讯 → 网易</text><rect x="549" y="542" width="230" height="34" rx="17" fill="#1D2326"/><text x="664.0" y="565" font-size="16" fill="#B2BDB8" font-weight="500" text-anchor="middle">玩家 / 折腾工具</text><text x="874" y="111" font-size="15" fill="#B2BDB8" class="mono">MY LOADOUT</text><path d="M942 214H1017V374H1081" fill="none" stroke="#526345" stroke-width="2" /><path d="M942 214V443H1010" fill="none" stroke="#526345" stroke-width="2" /><circle cx="1017" cy="290" r="5" fill="#D4F477" class="signal"/><circle cx="962" cy="443" r="4" fill="#D4F477" class="signal"/><g transform="translate(871 152) scale(0.95)"><rect x="0" y="14" width="132" height="132" rx="23" fill="#111719"/><rect x="0" y="0" width="132" height="128" rx="23" fill="#30383C" stroke="#53605F"/><rect x="11" y="10" width="110" height="92" rx="17" fill="none" stroke="#53605F"/><text x="24" y="52" font-size="31" fill="#EFF1E8" font-weight="700" class="en">P</text><text x="23" y="85" font-size="18" fill="#EFF1E8" font-weight="500">产品</text></g><g transform="translate(1015 305) scale(0.95)"><rect x="0" y="14" width="132" height="132" rx="23" fill="#93B83D"/><rect x="0" y="0" width="132" height="128" rx="23" fill="#D4F477" stroke="#EAFABD"/><rect x="11" y="10" width="110" height="92" rx="17" fill="none" stroke="#EAFABD"/><text x="24" y="52" font-size="31" fill="#202823" font-weight="700" class="en">S</text><text x="23" y="85" font-size="18" fill="#202823" font-weight="500">系统</text></g><g transform="translate(867 371) scale(0.8)"><rect x="0" y="14" width="132" height="132" rx="23" fill="#111719"/><rect x="0" y="0" width="132" height="128" rx="23" fill="#30383C" stroke="#53605F"/><rect x="11" y="10" width="110" height="92" rx="17" fill="none" stroke="#53605F"/><text x="24" y="52" font-size="31" fill="#EFF1E8" font-weight="700" class="en">G</text><text x="23" y="85" font-size="18" fill="#EFF1E8" font-weight="500">游戏</text></g><text x="875" y="566" font-size="12" fill="#B2BDB8" class="mono">BUILT, NOT JUST WRITTEN.</text></svg>