<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1016" viewBox="0 0 720 1016" role="img" aria-labelledby="title"><title id="title">工作台：判断做什么、拿产物讨论、定位卡在哪、确认改对了。</title><style>text{font-family:'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif} .en{font-family:Arial,sans-serif} .mono{font-family:'Liberation Mono',Consolas,monospace;letter-spacing:1.4px}.signal{animation:pulse 4s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.signal{animation:none}}</style><rect x="0" y="0" width="720" height="1016" rx="18" fill="#131719"/><text x="36" y="48" font-size="22" fill="#B2BDB8" font-weight="500">02 / 工作台</text><text x="36" y="111" font-size="38" fill="#EFF1E8" font-weight="700">不在 PRD 那一步停下。</text><text x="36" y="158" font-size="26" fill="#B2BDB8">产品判断之外，继续做到产物和验证。</text><rect x="34" y="201" width="652" height="150" rx="13" fill="#1D2326" stroke="#343D40"/><text x="55" y="243" font-size="22" fill="#D4F477" font-weight="500" class="mono">01</text><text x="110" y="245" font-size="29" fill="#EFF1E8" font-weight="600">查清问题</text><text x="663" y="244" font-size="23" fill="#D4F477" font-weight="500" text-anchor="end">判断做什么</text><text x="111" y="288" font-size="25" fill="#B2BDB8">用户分层 / 现有实现</text><text x="111" y="327" font-size="25" fill="#B2BDB8">影响范围 / 成本</text><path d="M64 351V372" fill="none" stroke="#D4F477" stroke-width="2" /><rect x="34" y="372" width="652" height="150" rx="13" fill="#1D2326" stroke="#343D40"/><text x="55" y="414" font-size="22" fill="#D4F477" font-weight="500" class="mono">02</text><text x="110" y="416" font-size="29" fill="#EFF1E8" font-weight="600">做出东西</text><text x="663" y="415" font-size="23" fill="#D4F477" font-weight="500" text-anchor="end">拿产物讨论</text><text x="111" y="459" font-size="25" fill="#B2BDB8">交互原型 / 配置生成</text><text x="111" y="498" font-size="25" fill="#B2BDB8">代码阅读 / 接口试跑</text><path d="M64 522V543" fill="none" stroke="#D4F477" stroke-width="2" /><rect x="34" y="543" width="652" height="150" rx="13" fill="#1D2326" stroke="#343D40"/><text x="55" y="585" font-size="22" fill="#D4F477" font-weight="500" class="mono">03</text><text x="110" y="587" font-size="29" fill="#EFF1E8" font-weight="600">找到失误</text><text x="663" y="586" font-size="23" fill="#D4F477" font-weight="500" text-anchor="end">定位卡在哪</text><text x="111" y="630" font-size="25" fill="#B2BDB8">完整对话 / 检索内容</text><text x="111" y="669" font-size="25" fill="#B2BDB8">工具返回 / 人工复核</text><path d="M64 693V714" fill="none" stroke="#D4F477" stroke-width="2" /><rect x="34" y="714" width="652" height="150" rx="13" fill="#1D2326" stroke="#343D40"/><text x="55" y="756" font-size="22" fill="#D4F477" font-weight="500" class="mono">04</text><text x="110" y="758" font-size="29" fill="#EFF1E8" font-weight="600">再跑一遍</text><text x="663" y="757" font-size="23" fill="#D4F477" font-weight="500" text-anchor="end">确认改对了</text><text x="111" y="801" font-size="25" fill="#B2BDB8">修订规则 / 回归检查</text><text x="111" y="840" font-size="25" fill="#B2BDB8">对比结果 / 继续迭代</text><text x="36" y="932" font-size="25" fill="#EFF1E8" font-weight="500">资料版本 / 上下文 / 工具 / 检查标准</text><text x="36" y="979" font-size="21" fill="#B2BDB8">工作方式示意，不含真实业务数据。</text></svg>