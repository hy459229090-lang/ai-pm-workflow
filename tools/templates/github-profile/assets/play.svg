<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="244" viewBox="0 0 1200 244" role="img" aria-labelledby="title"><title id="title">个人兴趣与探索：游戏、个人记忆、阅读体验。只介绍主题，不披露具体项目。</title><style>text{font-family:'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif} .en{font-family:Arial,sans-serif} .mono{font-family:'Liberation Mono',Consolas,monospace;letter-spacing:1.4px}.signal{animation:pulse 4s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.signal{animation:none}}</style><rect x="0" y="0" width="1200" height="244" rx="18" fill="#F0F1E9"/><text x="38" y="45" font-size="18" fill="#56645B" font-weight="500">03 / 还在折腾</text><text x="1160" y="45" font-size="14" fill="#56645B" class="mono" text-anchor="end">OFF THE CLOCK</text><g transform="translate(40 86) scale(1.05)"><path d="M3 16C3 10 7 7 13 7H27C33 7 37 10 37 16L39 27C40 34 35 36 31 31L27 27H13L9 31C5 36 0 34 1 27ZM9 14V23M5 18H14M27 16H27.1M33 22H33.1" fill="none" stroke="#202823" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="101" y="114" font-size="28" fill="#202823" font-weight="650">游戏</text><text x="40" y="164" font-size="23" fill="#56645B">玩了很多年，</text><text x="40" y="201" font-size="23" fill="#56645B">也想试着做点新玩法。</text><path d="M389 88V207" fill="none" stroke="#CFD4C8" stroke-width="1" /><g transform="translate(431 86) scale(1.05)"><path d="M5 4H27L35 12V32H5ZM27 4V12H35M12 16H26M12 23H23" fill="none" stroke="#202823" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="492" y="114" font-size="28" fill="#202823" font-weight="650">个人记忆</text><text x="431" y="164" font-size="23" fill="#56645B">少一点手工整理，</text><text x="431" y="201" font-size="23" fill="#56645B">多留住一点自己的上下文。</text><path d="M780 88V207" fill="none" stroke="#CFD4C8" stroke-width="1" /><g transform="translate(822 86) scale(1.05)"><path d="M3 5H37V32H3ZM10 12H30M10 18H23M10 24H29" fill="none" stroke="#202823" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="883" y="114" font-size="28" fill="#202823" font-weight="650">阅读体验</text><text x="822" y="164" font-size="23" fill="#56645B">AI 写得越来越多，</text><text x="822" y="201" font-size="23" fill="#56645B">人怎么读得更好？</text></svg>