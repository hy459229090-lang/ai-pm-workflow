<svg xmlns="http://www.w3.org/2000/svg" width="720" height="897" viewBox="0 0 720 897" role="img" aria-labelledby="title"><title id="title">何阳 RicHe｜产品经理，腾讯到网易。给用户做产品，给自己造工具。</title><style>text{font-family:'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif} .en{font-family:Arial,sans-serif} .mono{font-family:'Liberation Mono',Consolas,monospace;letter-spacing:1.4px}.signal{animation:pulse 4s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.signal{animation:none}}</style><rect x="0" y="0" width="720" height="897" rx="18" fill="#131719"/><text x="34" y="50" font-size="23" fill="#EFF1E8" font-weight="500">何阳 / HE YANG</text><text x="33" y="207" font-size="164" fill="#EFF1E8" font-weight="800" class="en" letter-spacing="-10">RicHe</text><text x="36" y="290" font-size="50" fill="#EFF1E8" font-weight="700">给用户做产品。</text><text x="36" y="357" font-size="50" fill="#D4F477" font-weight="700">给自己造工具。</text><text x="37" y="411" font-size="25" fill="#B2BDB8">社区、增长、商业化，是我的业务底子。</text><text x="37" y="454" font-size="25" fill="#B2BDB8">现在做 C 端 Agent，也搭自己的工作系统。</text><path d="M35 495H685" fill="none" stroke="#343D40" stroke-width="1" /><text x="38" y="544" font-size="26" fill="#EFF1E8" font-weight="600">产品经理 / 腾讯 → 网易</text><text x="37" y="602" font-size="18" fill="#B2BDB8" class="mono">MY LOADOUT</text><path d="M125 694H574" fill="none" stroke="#526345" stroke-width="2" /><g transform="translate(41 626) scale(1.25)"><rect x="0" y="14" width="132" height="132" rx="23" fill="#111719"/><rect x="0" y="0" width="132" height="128" rx="23" fill="#30383C" stroke="#53605F"/><rect x="11" y="10" width="110" height="92" rx="17" fill="none" stroke="#53605F"/><text x="24" y="52" font-size="31" fill="#EFF1E8" font-weight="700" class="en">P</text><text x="23" y="85" font-size="18" fill="#EFF1E8" font-weight="500">产品</text></g><g transform="translate(274 626) scale(1.25)"><rect x="0" y="14" width="132" height="132" rx="23" fill="#93B83D"/><rect x="0" y="0" width="132" height="128" rx="23" fill="#D4F477" stroke="#EAFABD"/><rect x="11" y="10" width="110" height="92" rx="17" fill="none" stroke="#EAFABD"/><text x="24" y="52" font-size="31" fill="#202823" font-weight="700" class="en">S</text><text x="23" y="85" font-size="18" fill="#202823" font-weight="500">系统</text></g><g transform="translate(507 626) scale(1.25)"><rect x="0" y="14" width="132" height="132" rx="23" fill="#111719"/><rect x="0" y="0" width="132" height="128" rx="23" fill="#30383C" stroke="#53605F"/><rect x="11" y="10" width="110" height="92" rx="17" fill="none" stroke="#53605F"/><text x="24" y="52" font-size="31" fill="#EFF1E8" font-weight="700" class="en">G</text><text x="23" y="85" font-size="18" fill="#EFF1E8" font-weight="500">游戏</text></g><text x="38" y="856" font-size="20" fill="#B2BDB8" class="mono">PRODUCT · SYSTEMS · PLAY</text></svg>