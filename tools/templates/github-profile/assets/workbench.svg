<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="579" viewBox="0 0 1200 579" role="img" aria-labelledby="title"><title id="title">我的工作台：查数据和实现以判断问题；做交互原型和接口验证；从完整对话和工具结果定位失败；修订并回归检查。不同任务按需组合，不是实时运行数据。</title><style>text{font-family:'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif} .en{font-family:Arial,sans-serif} .mono{font-family:'Liberation Mono',Consolas,monospace;letter-spacing:1.4px}.signal{animation:pulse 4s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.signal{animation:none}}</style><rect x="0" y="0" width="1200" height="579" rx="18" fill="#131719"/><text x="40" y="46" font-size="18" fill="#B2BDB8" font-weight="500">02 / 工作台</text><text x="1160" y="46" font-size="14" fill="#B2BDB8" class="mono" text-anchor="end">HOW I WORK</text><text x="40" y="109" font-size="38" fill="#EFF1E8" font-weight="700">我通常不在 PRD 那一步停下。</text><text x="42" y="154" font-size="23" fill="#B2BDB8">产品判断之外，继续查数据、做原型、验接口、追失败原因。</text><rect x="40" y="201" width="262" height="224" rx="13" fill="#1D2326" stroke="#343D40"/><text x="59" y="235" font-size="16" fill="#D4F477" font-weight="500" class="mono">01</text><text x="60" y="282" font-size="29" fill="#EFF1E8" font-weight="600">查清问题</text><text x="60" y="322" font-size="18" fill="#B2BDB8">用户分层 / 现有实现</text><text x="60" y="351" font-size="18" fill="#B2BDB8">影响范围 / 成本</text><path d="M60 371H282" fill="none" stroke="#343D40" stroke-width="1" /><text x="60" y="402" font-size="20" fill="#D4F477" font-weight="500">判断做什么</text><path d="M302 297H326M319 292L326 297L319 302" fill="none" stroke="#D4F477" stroke-width="1.6" /><rect x="326" y="201" width="262" height="224" rx="13" fill="#1D2326" stroke="#343D40"/><text x="345" y="235" font-size="16" fill="#D4F477" font-weight="500" class="mono">02</text><text x="346" y="282" font-size="29" fill="#EFF1E8" font-weight="600">做出东西</text><text x="346" y="322" font-size="18" fill="#B2BDB8">交互原型 / 配置生成</text><text x="346" y="351" font-size="18" fill="#B2BDB8">代码阅读 / 接口试跑</text><path d="M346 371H568" fill="none" stroke="#343D40" stroke-width="1" /><text x="346" y="402" font-size="20" fill="#D4F477" font-weight="500">拿产物讨论</text><path d="M588 297H612M605 292L612 297L605 302" fill="none" stroke="#D4F477" stroke-width="1.6" /><rect x="612" y="201" width="262" height="224" rx="13" fill="#1D2326" stroke="#343D40"/><text x="631" y="235" font-size="16" fill="#D4F477" font-weight="500" class="mono">03</text><text x="632" y="282" font-size="29" fill="#EFF1E8" font-weight="600">找到失误</text><text x="632" y="322" font-size="18" fill="#B2BDB8">完整对话 / 检索内容</text><text x="632" y="351" font-size="18" fill="#B2BDB8">工具返回 / 人工复核</text><path d="M632 371H854" fill="none" stroke="#343D40" stroke-width="1" /><text x="632" y="402" font-size="20" fill="#D4F477" font-weight="500">定位卡在哪</text><path d="M874 297H898M891 292L898 297L891 302" fill="none" stroke="#D4F477" stroke-width="1.6" /><rect x="898" y="201" width="262" height="224" rx="13" fill="#1D2326" stroke="#343D40"/><text x="917" y="235" font-size="16" fill="#D4F477" font-weight="500" class="mono">04</text><text x="918" y="282" font-size="29" fill="#EFF1E8" font-weight="600">再跑一遍</text><text x="918" y="322" font-size="18" fill="#B2BDB8">修订规则 / 回归检查</text><text x="918" y="351" font-size="18" fill="#B2BDB8">对比结果 / 继续迭代</text><path d="M918 371H1140" fill="none" stroke="#343D40" stroke-width="1" /><text x="918" y="402" font-size="20" fill="#D4F477" font-weight="500">确认改对了</text><path d="M1032 442V466H172V442" fill="none" stroke="#587043" stroke-width="1.5" /><circle cx="544" cy="466" r="5" fill="#D4F477" class="signal"/><text x="601" y="510" font-size="21" fill="#EFF1E8" font-weight="500" text-anchor="middle">资料版本 + 任务上下文 + 工具执行 + 检查标准</text><text x="601" y="548" font-size="16" fill="#B2BDB8" text-anchor="middle">工作方式示意 · 不同任务按需组合 · 非实时运行数据</text></svg>