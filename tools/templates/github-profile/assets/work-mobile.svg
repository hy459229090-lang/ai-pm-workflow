<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1008" viewBox="0 0 720 1008" role="img" aria-labelledby="title desc"><title id="title">文档之外，我具体做什么</title><desc id="desc">数据与实现依据；原型、接口和配置验证；完整对话评估、失败归因与回归检查。</desc><style>
:root{--paper:#f3f0e8;--ink:#202c3a;--muted:#5c666f;--line:#d4d2ca;--accent:#aa4a32;--wash:#eae6dc;--navy:#263b52;--on:#f7f4ec;--fine:#dce1e5}
@media(prefers-color-scheme:dark){:root{--paper:#17212e;--ink:#f0ede4;--muted:#a5b0ba;--line:#354353;--accent:#eea284;--wash:#1e2b3a;--navy:#c9d7e4;--on:#17212e;--fine:#4c5d70}}
text{font-family:Inter,'Helvetica Neue',Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:var(--ink)}
.mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace;letter-spacing:2px}
.serif{font-family:Georgia,'Times New Roman',serif}
.small{fill:var(--muted)}.accent{fill:var(--accent)}.line{stroke:var(--line);stroke-width:1}.paper{fill:var(--paper)}.wash{fill:var(--wash)}
</style><rect width="720" height="1008" rx="4" class="paper"/><text x="34" y="47" font-size="20" class="mono small" >02 / WORKING DEPTH</text><text x="34" y="108" font-size="38" font-weight="600" >文档之外，我具体做什么</text><line x1="34" y1="144" x2="686" y2="144" class="line" /><text x="36" y="198" font-size="35" class="serif accent" >01</text><text x="98" y="198" font-size="28" font-weight="600" >定义问题</text><text x="36" y="261" font-size="30" font-weight="600" >先查依据，再决定做不做。</text><text x="36" y="305" font-size="27" class="small" >取数、分群，核对现有实现和成本。</text><text x="36" y="349" font-size="27" class="small" >把需求讨论推进到有依据的产品取舍。</text><text x="36" y="389" font-size="22" class="accent" >数据分析 / 实现盘点 / 方案取舍</text><line x1="34" y1="421" x2="686" y2="421" class="line" /><text x="36" y="475" font-size="35" class="serif accent" >02</text><text x="98" y="475" font-size="28" font-weight="600" >推进交付</text><text x="36" y="538" font-size="30" font-weight="600" >方案之外，继续做原型和验证。</text><text x="36" y="582" font-size="27" class="small" >原型、接口试跑和配置校验进工作流。</text><text x="36" y="626" font-size="27" class="small" >能提前验证的，不等到最后一次联调。</text><text x="36" y="666" font-size="22" class="accent" >交互原型 / 接口验证 / 配置检查</text><line x1="34" y1="698" x2="686" y2="698" class="line" /><text x="36" y="752" font-size="35" class="serif accent" >03</text><text x="98" y="752" font-size="28" font-weight="600" >检查质量</text><text x="36" y="815" font-size="30" font-weight="600" >看完整对话，也看中间发生了什么。</text><text x="36" y="859" font-size="27" class="small" >批量评估多轮对话，追查检索与工具结果。</text><text x="36" y="903" font-size="27" class="small" >把失败归类，形成改动清单和回归检查。</text><text x="36" y="943" font-size="22" class="accent" >多轮评估 / 失败归因 / 回归检查</text></svg>