<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1008" viewBox="0 0 720 1008" role="img" aria-labelledby="title desc"><title id="title">我的工作，做到哪一层</title><desc id="desc">数据与实现依据；原型、接口和配置验证；完整对话评估、失败归因与回归检查。</desc><style>
:root{--paper:#f3f0e8;--ink:#202c3a;--muted:#5c666f;--line:#d4d2ca;--accent:#aa4a32;--wash:#eae6dc;--navy:#263b52;--on:#f7f4ec;--fine:#dce1e5}
@media(prefers-color-scheme:dark){:root{--paper:#17212e;--ink:#f0ede4;--muted:#a5b0ba;--line:#354353;--accent:#eea284;--wash:#1e2b3a;--navy:#c9d7e4;--on:#17212e;--fine:#4c5d70}}
text{font-family:Inter,'Helvetica Neue',Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:var(--ink)}
.mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace;letter-spacing:2px}
.serif{font-family:Georgia,'Times New Roman',serif}
.small{fill:var(--muted)}.accent{fill:var(--accent)}.line{stroke:var(--line);stroke-width:1}.paper{fill:var(--paper)}.wash{fill:var(--wash)}
</style><rect width="720" height="1008" rx="4" class="paper"/><text x="34" y="47" font-size="20" class="mono small">02 / WORKING DEPTH</text><text x="34" y="108" font-size="38" font-weight="600">我的工作，做到哪一层</text><line x1="34" y1="144" x2="686" y2="144" class="line" /><text x="36" y="198" font-size="35" class="serif accent">01</text><text x="98" y="198" font-size="28" font-weight="600">产品决策</text><text x="36" y="261" font-size="30" font-weight="600">产品判断，同时对齐数据和实现。</text><text x="36" y="305" font-size="27" class="small">分层、目标、现有代码与成本一起看。</text><text x="36" y="349" font-size="27" class="small">交付可取舍的方案，而不只是一份需求。</text><text x="36" y="389" font-size="22" class="accent">数据分析 / 实现盘点 / 方案取舍</text><line x1="34" y1="421" x2="686" y2="421" class="line" /><text x="36" y="475" font-size="35" class="serif accent">02</text><text x="98" y="475" font-size="28" font-weight="600">工作流工程</text><text x="36" y="538" font-size="30" font-weight="600">从一条提示词，做到可复用工作流。</text><text x="36" y="582" font-size="27" class="small">资料正本、上下文、工具和验证标准。</text><text x="36" y="626" font-size="27" class="small">把查数、原型、接口和检查接成可重复的任务。</text><text x="36" y="666" font-size="22" class="accent">交互原型 / 接口验证 / 配置检查</text><line x1="34" y1="698" x2="686" y2="698" class="line" /><text x="36" y="752" font-size="35" class="serif accent">03</text><text x="98" y="752" font-size="28" font-weight="600">Agent 评测</text><text x="36" y="815" font-size="30" font-weight="600">从答案打分，做到执行过程的诊断。</text><text x="36" y="859" font-size="27" class="small">追查意图、检索、工具返回与多轮对话。</text><text x="36" y="903" font-size="27" class="small">定位失败原因，再形成修改和回归检查。</text><text x="36" y="943" font-size="22" class="accent">多轮评估 / 失败归因 / 回归检查</text></svg>