<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="676" viewBox="0 0 1080 676" role="img" aria-labelledby="title desc"><title id="title">文档之外，我具体做什么</title><desc id="desc">产品判断、动手交付、质量验证。展示工作方式，不代表同一案例全部实施或经过竞品对照。</desc><style>
:root{--paper:#f3f0e8;--ink:#202c3a;--muted:#5c666f;--line:#d4d2ca;--accent:#aa4a32;--wash:#eae6dc;--navy:#263b52;--on:#f7f4ec;--fine:#dce1e5}
@media(prefers-color-scheme:dark){:root{--paper:#17212e;--ink:#f0ede4;--muted:#a5b0ba;--line:#354353;--accent:#eea284;--wash:#1e2b3a;--navy:#c9d7e4;--on:#17212e;--fine:#4c5d70}}
text{font-family:Inter,'Helvetica Neue',Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:var(--ink)}
.mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace;letter-spacing:2px}
.serif{font-family:Georgia,'Times New Roman',serif}
.small{fill:var(--muted)}.accent{fill:var(--accent)}.line{stroke:var(--line);stroke-width:1}.paper{fill:var(--paper)}.wash{fill:var(--wash)}
</style><rect width="1080" height="676" rx="4" class="paper"/><text x="34" y="41" font-size="14" class="mono small" >02 / WORKING DEPTH</text><text x="34" y="100" font-size="36" font-weight="600" >文档之外，我具体做什么</text><line x1="34" y1="145" x2="1046" y2="145" class="line" /><text x="38" y="206" font-size="45" class="serif accent" >01</text><text x="115" y="202" font-size="23" font-weight="600" >定义问题</text><text x="313" y="197" font-size="28" font-weight="600" >先查依据，再决定做不做。</text><text x="313" y="236" font-size="22" class="small" >取数、分群、核对现有实现和成本。</text><text x="313" y="270" font-size="22" class="small" >把需求讨论推进到有依据的产品取舍。</text><text x="115" y="250" font-size="12" class="mono small" >BUSINESS</text><line x1="34" y1="315" x2="1046" y2="315" class="line" /><text x="38" y="376" font-size="45" class="serif accent" >02</text><text x="115" y="372" font-size="23" font-weight="600" >推进交付</text><text x="313" y="367" font-size="28" font-weight="600" >方案之外，继续做原型和验证。</text><text x="313" y="406" font-size="22" class="small" >把原型、接口试跑和配置校验接进工作流。</text><text x="313" y="440" font-size="22" class="small" >能提前验证的，不等到最后一次联调。</text><text x="115" y="420" font-size="12" class="mono small" >DELIVERY</text><line x1="34" y1="485" x2="1046" y2="485" class="line" /><text x="38" y="546" font-size="45" class="serif accent" >03</text><text x="115" y="542" font-size="23" font-weight="600" >检查质量</text><text x="313" y="537" font-size="28" font-weight="600" >看完整对话，也看中间发生了什么。</text><text x="313" y="576" font-size="22" class="small" >批量评估多轮对话，追查检索与工具结果。</text><text x="313" y="610" font-size="22" class="small" >把失败归类，形成改动清单和回归检查。</text><text x="115" y="590" font-size="12" class="mono small" >EVALUATION</text></svg>