<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="676" viewBox="0 0 1080 676" role="img" aria-labelledby="title desc"><title id="title">我的工作，做到哪一层</title><desc id="desc">产品判断、动手交付、质量验证。展示工作方式，不代表同一案例全部实施或经过竞品对照。</desc><style>
:root{--paper:#f3f0e8;--ink:#202c3a;--muted:#5c666f;--line:#d4d2ca;--accent:#aa4a32;--wash:#eae6dc;--navy:#263b52;--on:#f7f4ec;--fine:#dce1e5}
@media(prefers-color-scheme:dark){:root{--paper:#17212e;--ink:#f0ede4;--muted:#a5b0ba;--line:#354353;--accent:#eea284;--wash:#1e2b3a;--navy:#c9d7e4;--on:#17212e;--fine:#4c5d70}}
text{font-family:Inter,'Helvetica Neue',Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:var(--ink)}
.mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace;letter-spacing:2px}
.serif{font-family:Georgia,'Times New Roman',serif}
.small{fill:var(--muted)}.accent{fill:var(--accent)}.line{stroke:var(--line);stroke-width:1}.paper{fill:var(--paper)}.wash{fill:var(--wash)}
</style><rect width="1080" height="676" rx="4" class="paper"/><text x="34" y="41" font-size="14" class="mono small">02 / WORKING DEPTH</text><text x="34" y="100" font-size="36" font-weight="600">我的工作，做到哪一层</text><line x1="34" y1="145" x2="1046" y2="145" class="line" /><text x="38" y="206" font-size="45" class="serif accent">01</text><text x="115" y="202" font-size="23" font-weight="600">产品决策</text><text x="313" y="197" font-size="28" font-weight="600">产品判断，同时对齐数据和实现。</text><text x="313" y="236" font-size="22" class="small">用户分层、业务目标、现有代码与成本一起看。</text><text x="313" y="270" font-size="22" class="small">交付可取舍的方案，而不只是一份需求。</text><text x="115" y="250" font-size="12" class="mono small">BUSINESS</text><line x1="34" y1="315" x2="1046" y2="315" class="line" /><text x="38" y="376" font-size="45" class="serif accent">02</text><text x="115" y="372" font-size="23" font-weight="600">工作流工程</text><text x="313" y="367" font-size="28" font-weight="600">从一条提示词，做到可复用工作流。</text><text x="313" y="406" font-size="22" class="small">资料正本、任务上下文、工具执行、验证标准。</text><text x="313" y="440" font-size="22" class="small">把查数、原型、接口和检查接成可重复的任务。</text><text x="115" y="420" font-size="12" class="mono small">DELIVERY</text><line x1="34" y1="485" x2="1046" y2="485" class="line" /><text x="38" y="546" font-size="45" class="serif accent">03</text><text x="115" y="542" font-size="23" font-weight="600">Agent 评测</text><text x="313" y="537" font-size="28" font-weight="600">从答案打分，做到执行过程的诊断。</text><text x="313" y="576" font-size="22" class="small">沿用户意图、检索、工具返回与多轮对话追查。</text><text x="313" y="610" font-size="22" class="small">定位失败原因，再形成修改和回归检查。</text><text x="115" y="590" font-size="12" class="mono small">EVALUATION</text></svg>