<svg xmlns="http://www.w3.org/2000/svg" width="720" height="535" viewBox="0 0 720 535" role="img" aria-labelledby="title"><title id="title">个人兴趣与探索：游戏、个人记忆、阅读体验。</title><style>text{font-family:'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif}</style><rect width="720" height="535" rx="18" fill="#F0F1E9"/><text x="35" y="48" font-size="22" fill="#56645B" font-weight="500">03 / 还在折腾</text><g transform="translate(36 93) scale(1.1)"><path d="M3 16C3 10 7 7 13 7H27C33 7 37 10 37 16L39 27C40 34 35 36 31 31L27 27H13L9 31C5 36 0 34 1 27ZM9 14V23M5 18H14M27 16H27.1M33 22H33.1" fill="none" stroke="#202823" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="103" y="125" font-size="29" fill="#202823" font-weight="600">游戏</text><text x="103" y="170" font-size="24" fill="#56645B">玩了很多年，也想试着做点新玩法。</text><path d="M35 201H685" fill="none" stroke="#CFD4C8"/><g transform="translate(36 238) scale(1.1)"><path d="M5 4H27L35 12V32H5ZM27 4V12H35M12 16H26M12 23H23" fill="none" stroke="#202823" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="103" y="270" font-size="29" fill="#202823" font-weight="600">个人记忆</text><text x="103" y="315" font-size="24" fill="#56645B">少一点手工整理，多留住一点自己的上下文。</text><path d="M35 346H685" fill="none" stroke="#CFD4C8"/><g transform="translate(36 383) scale(1.1)"><path d="M3 5H37V32H3ZM10 12H30M10 18H23M10 24H29" fill="none" stroke="#202823" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="103" y="415" font-size="29" fill="#202823" font-weight="600">阅读体验</text><text x="103" y="460" font-size="24" fill="#56645B">AI 写得越来越多，人怎么读得更好？</text></svg>