<svg xmlns="http://www.w3.org/2000/svg" width="720" height="691" viewBox="0 0 720 691" role="img" aria-labelledby="title"><title id="title">职业存档：腾讯社区互动、增长商业化，到网易 C 端 AI 助手。</title><style>text{font-family:'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif}.en{font-family:Arial,sans-serif}</style><rect width="720" height="691" rx="18" fill="#F0F1E9"/><text x="36" y="48" font-size="22" fill="#56645B" font-weight="500">01 / 存档</text><text x="36" y="111" font-size="37" fill="#202823" font-weight="700">从玩家社区，走到 Agent。</text><path d="M53 173V565" fill="none" stroke="#BEC6B8" stroke-width="2"/><circle cx="53" cy="173" r="7" fill="#202823"/><text x="91" y="180" font-size="24" fill="#56645B" class="en">2018—2021</text><text x="90" y="227" font-size="32" fill="#202823" font-weight="700">腾讯</text><text x="185" y="227" font-size="28" fill="#202823" font-weight="500">社区与互动</text><text x="91" y="272" font-size="26" fill="#56645B">人为什么来，为什么留下。</text><circle cx="53" cy="357" r="7" fill="#202823"/><text x="91" y="364" font-size="24" fill="#56645B" class="en">2021—2024</text><text x="90" y="411" font-size="32" fill="#202823" font-weight="700">腾讯</text><text x="185" y="411" font-size="28" fill="#202823" font-weight="500">增长与商业化</text><text x="91" y="456" font-size="26" fill="#56645B">怎么让增长带来生意。</text><circle cx="53" cy="541" r="7" fill="#65801D"/><text x="91" y="548" font-size="24" fill="#56645B" class="en">2025—现在</text><text x="90" y="595" font-size="32" fill="#202823" font-weight="700">网易</text><text x="185" y="595" font-size="28" fill="#202823" font-weight="500">C 端 AI 助手</text><text x="91" y="640" font-size="26" fill="#56645B">用户要办的事，怎么接着做。</text></svg>