<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="326" viewBox="0 0 1200 326" role="img" aria-labelledby="title"><title id="title">职业存档：2018—2021 腾讯社区互动；2021—2024 腾讯增长商业化；2025至今网易 C 端 AI 助手。</title><style>text{font-family:'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif}.en{font-family:Arial,sans-serif}.mono{font-family:'Liberation Mono',Consolas,monospace;letter-spacing:1.4px}</style><rect width="1200" height="326" rx="18" fill="#F0F1E9"/><text x="38" y="44" font-size="18" fill="#56645B" font-weight="500">01 / 存档</text><text x="38" y="105" font-size="36" fill="#202823" font-weight="700">从玩家社区，走到 Agent。</text><text x="1160" y="47" font-size="14" fill="#56645B" class="mono" text-anchor="end">CAREER / SINCE 2018</text><path d="M47 158H1155" fill="none" stroke="#BEC6B8" stroke-width="2"/><circle cx="48" cy="158" r="7" fill="#202823"/><text x="44" y="197" font-size="18" fill="#56645B" class="en">2018—2021</text><text x="44" y="243" font-size="30" fill="#202823" font-weight="700">腾讯</text><text x="127" y="242" font-size="24" fill="#202823" font-weight="500">社区与互动</text><text x="44" y="284" font-size="21" fill="#56645B">人为什么来，为什么留下。</text><circle cx="442" cy="158" r="7" fill="#202823"/><text x="438" y="197" font-size="18" fill="#56645B" class="en">2021—2024</text><text x="438" y="243" font-size="30" fill="#202823" font-weight="700">腾讯</text><text x="521" y="242" font-size="24" fill="#202823" font-weight="500">增长与商业化</text><text x="438" y="284" font-size="21" fill="#56645B">怎么让增长带来生意。</text><circle cx="832" cy="158" r="7" fill="#65801D"/><text x="828" y="197" font-size="18" fill="#56645B" class="en">2025—现在</text><text x="828" y="243" font-size="30" fill="#202823" font-weight="700">网易</text><text x="911" y="242" font-size="24" fill="#202823" font-weight="500">C 端 AI 助手</text><text x="828" y="284" font-size="21" fill="#56645B">用户要办的事，怎么接着做。</text></svg>