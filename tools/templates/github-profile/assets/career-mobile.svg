<svg xmlns="http://www.w3.org/2000/svg" width="720" height="492" viewBox="0 0 720 492" role="img" aria-labelledby="title desc"><title id="title">职业历程</title><desc id="desc">2018—2021 腾讯，社区与直播互动；2021—2024 腾讯，增长与商业化；2025—现在 网易，C 端 AI 助手产品。</desc><style>
:root{--paper:#f3f0e8;--ink:#202c3a;--muted:#5c666f;--line:#d4d2ca;--accent:#aa4a32;--wash:#eae6dc;--navy:#263b52;--on:#f7f4ec;--fine:#dce1e5}
@media(prefers-color-scheme:dark){:root{--paper:#17212e;--ink:#f0ede4;--muted:#a5b0ba;--line:#354353;--accent:#eea284;--wash:#1e2b3a;--navy:#c9d7e4;--on:#17212e;--fine:#4c5d70}}
text{font-family:Inter,'Helvetica Neue',Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:var(--ink)}
.mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace;letter-spacing:2px}
.serif{font-family:Georgia,'Times New Roman',serif}
.small{fill:var(--muted)}.accent{fill:var(--accent)}.line{stroke:var(--line);stroke-width:1}.paper{fill:var(--paper)}.wash{fill:var(--wash)}
</style><rect width="720" height="492" rx="4" class="paper"/><text x="34" y="47" font-size="20" class="mono small" >01 / BACKGROUND</text><line x1="46" y1="102" x2="46" y2="422" class="line" /><circle cx="46" cy="103" r="7" fill="var(--muted)"/><text x="81" y="110" font-size="23" class="mono small" >2018 — 2021</text><text x="81" y="151" font-size="29" font-weight="600" >腾讯 / Tencent</text><text x="365" y="151" font-size="27" class="small" >社区与直播互动</text><circle cx="46" cy="229" r="7" fill="var(--muted)"/><text x="81" y="236" font-size="23" class="mono small" >2021 — 2024</text><text x="81" y="277" font-size="29" font-weight="600" >腾讯 / Tencent</text><text x="365" y="277" font-size="27" class="small" >增长与商业化</text><circle cx="46" cy="355" r="7" fill="var(--accent)"/><text x="81" y="362" font-size="23" class="mono accent" >2025 — 现在</text><text x="81" y="403" font-size="29" font-weight="600" >网易 / NetEase</text><text x="365" y="403" font-size="27" class="small" >C 端 AI 助手产品</text></svg>